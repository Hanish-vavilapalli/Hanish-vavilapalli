name: Daily Profile Contribution Activity

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append daily activity log entry
        run: |
          echo "Daily contribution check: $(date -u)" >> activity.log
          git config user.name "hanish0717"
          git config user.email "hanishvavilapalli7@gmail.com"
          git add activity.log
          git commit -m "chore(activity): daily contribution log entry [skip ci]" || exit 0
          git push
